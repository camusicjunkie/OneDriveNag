name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install modules
        shell: pwsh
        run: Install-Module Pester, ModuleBuilder, PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Lint
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./Source -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, ScriptName, Line, Message -AutoSize
          if ($r) { exit 1 }
      - name: Test
        shell: pwsh
        run: Invoke-Pester -Path ./Tests -CI -Output Detailed
      - name: Build
        shell: pwsh
        run: Build-Module -SourcePath ./Source/build.psd1
